name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Buat folder android jika belum ada
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name flutter_sqlite_demo .
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: catatan-sqlite-apk
          path: build/app/outputs/flutter-apk/app-release.apk
